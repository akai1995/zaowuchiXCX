<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>造物池</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #060608;
  --bg-secondary: #0D0D12;
  --bg-card: #13131A;
  --bg-card-hover: #1A1A24;
  --bg-surface: rgba(255,255,255,0.03);
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --text-primary: #F0F0F5;
  --text-secondary: #8A8A9A;
  --text-tertiary: #5A5A6A;
  --accent: #0348FF;
  --accent-light: #2B6BFF;
  --accent-glow: rgba(3, 72, 255, 0.25);
  --accent-soft: rgba(3, 72, 255, 0.12);
  --danger: #FF3B5C;
  --danger-soft: rgba(255,59,92,0.12);
  --success: #00D68F;
  --warning: #FFB020;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --font-display: 'Playfair Display', serif;
  --font-body: 'Noto Sans SC', -apple-system, sans-serif;
  --tab-height: 68px;
  --header-height: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;overflow:hidden;
  font-family:var(--font-body);
  background:var(--bg-primary);
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(3,72,255,0.06), transparent),
             radial-gradient(ellipse 60% 40% at 85% 80%, rgba(3,72,255,0.04), transparent);
}
body::after{
  content:'';position:fixed;inset:0;opacity:.035;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.app-container{
  position:relative;z-index:1;max-width:430px;height:100%;margin:0 auto;
  display:flex;flex-direction:column;background:var(--bg-primary);overflow:hidden;
}

/* Header */
.app-header{
  flex-shrink:0;height:var(--header-height);display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;position:relative;z-index:10;
}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.header-logo::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.2))}
.header-logo svg{width:18px;height:18px;position:relative;z-index:1}
.header-title{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.header-actions{display:flex;gap:8px}
.header-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-medium);background:var(--bg-surface);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.header-btn:active{background:var(--bg-card);border-color:var(--accent)}
.header-btn .badge{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--bg-primary)}

/* Main Content */
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
.main-content::-webkit-scrollbar{display:none}

/* Search */
.search-bar{position:relative;margin-bottom:16px;margin-top:4px}
.search-input{width:100%;padding:11px 14px 11px 40px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-family:var(--font-body);font-size:14px;outline:none;transition:all .2s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-input::placeholder{color:var(--text-tertiary)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);pointer-events:none}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);cursor:pointer;display:none;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,0.08);font-size:12px;border:none}
.search-clear.visible{display:flex}

/* Tab Pages */
.tab-page{display:none;padding:0 20px 20px;animation:fadeSlideIn .35s ease}
.tab-page.active{display:block}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Section Header */
.section-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.section-title{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:.01em}
.section-subtitle{font-size:13px;color:var(--text-tertiary);margin-top:2px;font-weight:400}
.section-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.stat-badge{font-size:11px;color:var(--text-tertiary);background:var(--bg-card);padding:4px 10px;border-radius:20px;border:1px solid var(--border-subtle)}
.add-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;white-space:nowrap;box-shadow:0 4px 20px var(--accent-glow)}
.add-btn:active{transform:scale(.96);box-shadow:0 2px 12px var(--accent-glow)}
.add-btn svg{width:15px;height:15px}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 30px;text-align:center}
.empty-icon{width:72px;height:72px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border-medium);display:flex;align-items:center;justify-content:center;margin-bottom:20px;color:var(--text-tertiary)}
.empty-state h3{font-family:var(--font-display);font-size:18px;margin-bottom:6px;color:var(--text-secondary)}
.empty-state p{font-size:13px;color:var(--text-tertiary);max-width:240px;line-height:1.5}

/* Card Grid */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Work Card */
.work-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .3s;position:relative}
.work-card:active{transform:scale(.97);border-color:var(--border-medium)}
.work-card-cover{width:100%;aspect-ratio:1;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);overflow:hidden;position:relative}
.work-card-cover img,.work-card-cover svg{width:100%;height:100%;object-fit:cover;display:block}
.work-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6));opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px}
.work-card:active .work-card-overlay,.work-card.long-press .work-card-overlay{opacity:1}
.work-card-body{padding:12px}
.work-card-title{font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-card-desc{font-size:12px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.work-card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent-light);font-weight:500;border:1px solid rgba(3,72,255,.15)}
.tag-outline{background:transparent;border:1px solid var(--border-medium);color:var(--text-secondary)}

/* Context Menu */
.context-menu{position:fixed;z-index:300;background:var(--bg-card);border:1px solid var(--border-medium);border-radius:var(--radius-md);padding:4px;min-width:120px;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:scaleIn .15s ease;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.context-item{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;color:var(--text-secondary)}
.context-item:active{background:var(--bg-card-hover)}
.context-item.danger{color:var(--danger)}
.context-item.danger:active{background:var(--danger-soft)}

/* Confirm Dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease}
.confirm-dialog{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);width:calc(100% - 60px);max-width:320px;padding:24px;text-align:center;animation:scaleIn .25s ease}
.confirm-dialog h3{font-family:var(--font-display);font-size:18px;margin-bottom:8px}
.confirm-dialog p{font-size:14px;color:var(--text-secondary);line-height:1.5;margin-bottom:20px}
.confirm-actions{display:flex;gap:10px}
.confirm-btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none}
.confirm-btn:active{transform:scale(.97)}
.confirm-cancel{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border-medium)}
.confirm-danger{background:var(--danger);color:#fff}

/* Modal Overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{background:var(--bg-secondary);border-radius:var(--radius-xl) var(--radius-xl) 0 0;width:100%;max-width:430px;max-height:85vh;overflow-y:auto;animation:slideUp .35s cubic-bezier(.16,1,.3,1);border:1px solid var(--border-subtle);border-bottom:none}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-sheet.noscroll{overflow:hidden}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border-medium);margin:12px auto 8px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 16px;border-bottom:1px solid var(--border-subtle)}
.modal-title{font-family:var(--font-display);font-size:20px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-medium);background:var(--bg-card);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .2s}
.modal-close:active{background:var(--bg-card-hover)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}

/* Form Elements */
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.form-label .required{color:var(--danger);margin-left:2px}
.form-input,.form-textarea,.form-select{width:100%;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border-medium);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-body);font-size:14px;transition:all .2s;outline:none}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5}
.form-select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238A8A9A' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}

/* Upload */
.upload-area{border:1.5px dashed var(--border-medium);border-radius:var(--radius-md);padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .25s;background:var(--bg-surface);color:var(--text-tertiary)}
.upload-area:active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-light)}
.upload-area svg{width:32px;height:32px}
.upload-area .upload-text{font-size:13px;font-weight:500}
.upload-area .upload-hint{font-size:11px;color:var(--text-tertiary)}
.upload-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.upload-preview-item{aspect-ratio:1;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border-subtle);overflow:hidden;position:relative}
.upload-preview-item img{width:100%;height:100%;object-fit:cover}
.upload-preview-item .remove-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}

/* Submit */
.submit-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;margin-top:4px;box-shadow:0 4px 20px var(--accent-glow)}
.submit-btn:active{transform:scale(.98);box-shadow:0 2px 10px var(--accent-glow)}
.submit-btn.delete{margin-top:8px;background:transparent;border:1px solid var(--danger);color:var(--danger);box-shadow:none}
.submit-btn.delete:active{background:var(--danger-soft)}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border-medium);padding:12px 24px;border-radius:var(--radius-md);font-size:14px;color:var(--text-primary);z-index:300;animation:toastIn .3s ease,toastOut .3s ease 2s forwards;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);white-space:nowrap;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Detail Modal */
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease}
.detail-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);width:calc(100% - 40px);max-width:430px;max-height:80vh;overflow-y:auto;animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
.detail-card::-webkit-scrollbar{display:none}
.detail-cover{width:100%;aspect-ratio:16/10;background:var(--bg-card);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);overflow:hidden;position:relative}
.detail-cover img,.detail-cover svg{width:100%;height:100%;object-fit:cover;display:block}
.detail-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;backdrop-filter:blur(8px);z-index:2}
.detail-actions{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.detail-act-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;backdrop-filter:blur(8px);transition:all .2s}
.detail-act-btn:active{background:rgba(0,0,0,.8)}
.detail-body{padding:20px}
.detail-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:6px}
.detail-desc{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.detail-time{font-size:12px;color:var(--text-tertiary);margin-left:auto}
.detail-field{margin-bottom:12px;background:var(--bg-card);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border-subtle)}
.detail-field-label{font-size:11px;color:var(--text-tertiary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.detail-field-value{font-size:14px;color:var(--text-primary);line-height:1.5}
.detail-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.detail-gallery-item{aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-card);border:1px solid var(--border-subtle);cursor:pointer}
.detail-gallery-item img,.detail-gallery-item svg{width:100%;height:100%;object-fit:cover}
.detail-link{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-weight:500;margin-top:8px;transition:all .2s}
.detail-link:active{opacity:.8}
.detail-empty-gallery{grid-column:1/-1;text-align:center;padding:20px;color:var(--text-tertiary);font-size:13px}

/* App Card */
.app-list{display:flex;flex-direction:column;gap:10px}
.app-card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .25s;position:relative}
.app-card:active{background:var(--bg-card-hover);border-color:var(--border-medium)}
.app-icon{width:46px;height:46px;border-radius:var(--radius-sm);background:var(--accent-soft);border:1px solid rgba(3,72,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent-light);overflow:hidden}
.app-icon svg{width:22px;height:22px}
.app-info{flex:1;min-width:0}
.app-name{font-size:15px;font-weight:600;margin-bottom:2px}
.app-type{font-size:12px;color:var(--text-tertiary)}
.app-meta{display:flex;align-items:center;gap:8px;margin-top:3px}
.app-link-hint{font-size:11px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.app-arrow{color:var(--text-tertiary);flex-shrink:0;transition:transform .2s}
.app-card:active .app-arrow{transform:translateX(3px)}

/* Filter Chips */
.filter-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid var(--border-medium);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.filter-chip:active{transform:scale(.95)}

/* Full Image Viewer */
.image-viewer{position:fixed;inset:0;background:#000;z-index:250;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.image-viewer img,.image-viewer svg{max-width:100%;max-height:100%;object-fit:contain}
.image-viewer-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Tab Bar */
.tab-bar{flex-shrink:0;height:var(--tab-height);background:var(--bg-secondary);border-top:1px solid var(--border-subtle);display:flex;align-items:center;padding:0 8px;padding-bottom:var(--safe-bottom);position:relative;z-index:10}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--text-tertiary);transition:all .3s;padding:6px 0;position:relative}
.tab-item.active{color:var(--accent)}
.tab-item.active::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.tab-label{font-size:11px;font-weight:500}
.tab-badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600}

@media(min-width:431px){.app-container{border-left:1px solid var(--border-subtle);border-right:1px solid var(--border-subtle)}}
</style>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div class="header-brand">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>

// ── SVG Cover Generators ──
function svgCover(config) {
  const {gradient, shapes, text, icon} = config;
  let shapeEls = '';
  if (shapes) {
    shapes.forEach((s,i) => {
      shapeEls += `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" fill="${s.fill}" opacity="${s.opacity||0.6}"/>`;
      shapeEls += `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r*1.6}" fill="none" stroke="${s.fill}" stroke-width="0.5" opacity="${(s.opacity||0.6)*0.4}"/>`;
    });
  }
  let textEl = '';
  if (text) {
    textEl = `<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="rgba(255,255,255,0.9)" font-family="'Noto Sans SC',sans-serif" font-size="18" font-weight="700" letter-spacing="0.05em">${text}</text>`;
  }
  let iconEl = '';
  if (icon) {
    iconEl = `<g transform="translate(128,100)" opacity="0.25">${icon}</g>`;
  }
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${gradient[0]}"/><stop offset="100%" stop-color="${gradient[1]}"/></linearGradient></defs><rect width="256" height="256" fill="url(#g)"/>${shapeEls}${iconEl}${textEl}</svg>`;
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
}

// Regenerate SVG covers from coverConfig
function hydrateCovers(items) {
  items.forEach(item => {
    if (item.coverConfig && !item.cover) {
      item.cover = svgCover(item.coverConfig);
    }
  });
}

// ── Persistence: localStorage ──
const LS_KEY = 'zaowuchi_userdata';
const DATA_VERSION = 3; // 升级版本号自动清除旧数据

function _lsSave(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ _v: DATA_VERSION, ...data })); return true; }
  catch(e) { return false; }
}

function _lsLoad() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    // 版本不匹配 → 清除旧数据，重新开始
    if (parsed._v !== DATA_VERSION) {
      localStorage.removeItem(LS_KEY);
      return null;
    }
    return parsed;
  } catch(e) { return null; }
}

// ── Data Loading ──

function saveData() {
  _lsSave({ works: Store.works, aiImages: Store.aiImages, aiApps: Store.aiApps });
  updateBadges();
}

function loadData() {
  // 合并用户手动添加的数据
  const userData = _lsLoad();
  Store.works = userData && userData.works ? userData.works : [];
  Store.aiImages = userData && userData.aiImages ? userData.aiImages : [];
  Store.aiApps = userData && userData.aiApps ? userData.aiApps : [];
  hydrateCovers(Store.works);
  hydrateCovers(Store.aiImages);
}

// ── Time Format ──
function formatTime(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + ' 分钟前';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' 小时前';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + ' 天前';
  const weeks = Math.floor(days / 7);
  if (weeks < 4) return weeks + ' 周前';
  return new Date(iso).toLocaleDateString('zh-CN', {month:'short',day:'numeric'});
}

  Store.activeTab = tab;

  document.querySelector(`.tab-item[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.tab-page').forEach(el => el.classList.remove('active'));
  document.getElementById(`page-${tab}`).classList.add('active');
  renderCurrentPage();
}

  Store.searchQuery = '';
  const input = document.querySelector('.search-input');
  if (input) input.value = '';
  renderCurrentPage();
}

function filterBySearch(items) {
  if (!Store.searchQuery) return items;
  return items.filter(item => {
    const searchStr = (item.name + ' ' + (item.description||'') + ' ' + (item.category||'') + ' ' + (item.aiTool||'') + ' ' + (item.prompt||'') + ' ' + (item.type||'')).toLowerCase();
    return searchStr.includes(Store.searchQuery);
  });
}

function renderCurrentPage() {
  switch (Store.activeTab) {
    case 'works': renderWorks(); break;
    case 'aiimage': renderAIImage(); break;

// ── Context Menu ──
function showContextMenu(e, collection, id) {
  closeContextMenu();
  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.id = 'contextMenu';
  menu.style.left = Math.min(e.clientX, window.innerWidth - 130) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 130) + 'px';
  menu.innerHTML = `
    <div class="context-item" onclick="editItem('${collection}','${id}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      编辑
    </div>
    <div class="context-item danger" onclick="confirmDelete('${collection}','${id}')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      删除
    </div>
  `;
  document.body.appendChild(menu);
  setTimeout(() => document.addEventListener('click', closeContextMenu, {once: true}), 50);
}

function closeContextMenu() {
  const el = document.getElementById('contextMenu');
  if (el) el.remove();
}

// ── Confirm Delete ──
function confirmDelete(collection, id) {
  closeContextMenu();
  const container = document.getElementById('modalsContainer');
  const item = Store[collection]?.find(x => x.id === id);
  const name = item?.name || '此项';
  container.innerHTML = `
    <div class="confirm-overlay" onclick="if(event.target===this)closeModal()">
      <div class="confirm-dialog">
        <h3>确认删除</h3>
        <p>确定要删除「${name}」吗？此操作不可撤销。</p>
        <div class="confirm-actions">
          <button class="confirm-btn confirm-cancel" onclick="closeModal()">取消</button>
          <button class="confirm-btn confirm-danger" onclick="deleteItem('${collection}','${id}')">删除</button>
        </div>
      </div>
    </div>
  `;
}

function deleteItem(collection, id) {
  Store[collection] = Store[collection].filter(x => x.id !== id);
  saveData();
  closeModal();
  renderCurrentPage();
  showToast('已删除');
}

// ── Edit Item ──
function editItem(collection, id) {
  closeContextMenu();
  const item = Store[collection]?.find(x => x.id === id);
  if (!item) return;
  if (collection === 'works') openWorksModal(item);
  else if (collection === 'aiImages') openAIImageModal(item);
  else if (collection === 'aiApps') openAIAppModal(item);
}

// ── File Handlers ──
let tempCoverData = null;
let tempImagesData = [];
let tempAppFileData = null;
let editTargetId = null;

function handleCoverUpload(input, previewId, areaId) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    tempCoverData = e.target.result;
    document.getElementById(previewId).innerHTML = `<div class="upload-preview-item"><img src="${e.target.result}" alt="cover"><button class="remove-btn" onclick="tempCoverData=null;document.getElementById('${previewId}').innerHTML='';document.getElementById('${areaId}').style.display=''">✕</button></div>`;
    document.getElementById(areaId).style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function handleImagesUpload(input, previewId) {
  const files = Array.from(input.files);
  const preview = document.getElementById(previewId);
  files.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      tempImagesData.push(e.target.result);
      const i = tempImagesData.length - 1;
      preview.innerHTML += `<div class="upload-preview-item"><img src="${e.target.result}" alt="image"><button class="remove-btn" onclick="tempImagesData.splice(${i},1);this.parentElement.remove()">✕</button></div>`;
    };
    reader.readAsDataURL(file);
  });
}

function handleAppFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    tempAppFileData = { name: file.name, content: e.target.result };
    document.getElementById('appFileLabel').textContent = file.name;
  };
  reader.readAsDataURL(file);
}

    <div class="form-group">
      <label class="form-label">提示词</label>
      <textarea class="form-textarea" id="aiImagePrompt" placeholder="输入生成该作品使用的提示词...">${editItem?.prompt||''}</textarea>
    </div>
    <button class="submit-btn" onclick="submitAIImage()">${isEdit ? '保存修改' : '提交作品'}</button>
    ${isEdit ? `<button class="submit-btn delete" onclick="confirmDelete('aiImages','${editItem.id}')">删除此作品</button>` : ''}
  `);

  if (editItem) {
    if (editItem.cover) tempCoverData = editItem.cover;
    tempImagesData = [...(editItem.images || [])];
  }
}

// ── AI App Modal ──
function openAIAppModal(editItem) {
  editTargetId = editItem?.id || null;
  const isEdit = !!editItem;

  openModal(isEdit ? '编辑应用' : '添加应用', `
    <div class="form-group">
      <label class="form-label">应用名称<span class="required">*</span></label>
      <input class="form-input" id="appName" placeholder="请输入应用名称" value="${editItem?.name||''}">
    </div>
    <div class="form-group">
      <label class="form-label">应用类型<span class="required">*</span></label>
      <select class="form-select" id="appType">
        <option value="">请选择应用类型</option>
        ${['效率工具','创意设计','数据分析','内容生成','智能助手','其他'].map(t => `<option value="${t}" ${editItem?.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">应用链接</label>
      <input class="form-input" id="appLink" placeholder="https://..." value="${editItem?.link||''}">
      <span style="font-size:11px;color:var(--text-tertiary);margin-top:4px">或上传HTML文件</span>
    </div>
    <div class="form-group">
      <label class="form-label">HTML文件</label>
      <div class="upload-area" onclick="document.getElementById('appFileInput').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="upload-text" id="appFileLabel">${editItem?.htmlFile ? editItem.htmlFile.name : '点击上传HTML文件'}</span>
        <span class="upload-hint">仅支持 .html 文件</span>
      </div>
      <input type="file" id="appFileInput" accept=".html,.htm" style="display:none" onchange="handleAppFile(this)">
    </div>
    <button class="submit-btn" onclick="submitAIApp()">${isEdit ? '保存修改' : '添加应用'}</button>
    ${isEdit ? `<button class="submit-btn delete" onclick="confirmDelete('aiApps','${editItem.id}')">删除此应用</button>` : ''}
  `);

  if (editItem?.htmlFile) tempAppFileData = editItem.htmlFile;
}

// ── Submissions ──
function submitWorks() {
  const name = document.getElementById('worksName').value.trim();
  if (!name) { showToast('请输入作品名称'); return; }
  if (!tempCoverData && !editTargetId) { showToast('请上传作品封面'); return; }

  const data = {
    name,
    description: document.getElementById('worksDesc').value.trim(),
    category: document.getElementById('worksCategory').value,
    link: document.getElementById('worksLink').value.trim(),
    cover: tempCoverData,
    images: [...tempImagesData],
    createdAt: new Date().toISOString(),
  };

  if (editTargetId) {
    const idx = Store.works.findIndex(w => w.id === editTargetId);
    if (idx >= 0) {
      data.id = editTargetId;
      data.createdAt = Store.works[idx].createdAt;
      if (!tempCoverData) data.cover = Store.works[idx].cover;
      Store.works[idx] = data;
    }
  } else {
    data.id = generateId();
    Store.works.unshift(data);
  }

  const isEdit = !!editTargetId;
  tempCoverData = null; tempImagesData = []; editTargetId = null;
  saveData();
  closeModal();
  renderCurrentPage();
  showToast(isEdit ? '作品已更新' : '作品上传成功！');
}

function submitAIImage() {
  const name = document.getElementById('aiImageName').value.trim();
  if (!name) { showToast('请输入作品名称'); return; }
  if (!tempCoverData && !editTargetId) { showToast('请上传作品封面'); return; }
  const tool = document.getElementById('aiImageTool').value;
  if (!tool) { showToast('请选择AI工具'); return; }

  const data = {
    name,
    description: document.getElementById('aiImageDesc').value.trim(),
    category: document.getElementById('aiImageCategory').value,
    aiTool: tool,
    prompt: document.getElementById('aiImagePrompt').value.trim(),
    cover: tempCoverData,
    images: [...tempImagesData],
    createdAt: new Date().toISOString(),
  };

  if (editTargetId) {
    const idx = Store.aiImages.findIndex(w => w.id === editTargetId);
    if (idx >= 0) {
      data.id = editTargetId;
      data.createdAt = Store.aiImages[idx].createdAt;
      if (!tempCoverData) data.cover = Store.aiImages[idx].cover;
      Store.aiImages[idx] = data;
    }
  } else {
    data.id = generateId();
    Store.aiImages.unshift(data);
  }

  const isEdit = !!editTargetId;
  tempCoverData = null; tempImagesData = []; editTargetId = null;
  saveData();
  closeModal();
  renderCurrentPage();
  showToast(isEdit ? '作品已更新' : 'AI生图作品上传成功！');
}

function submitAIApp() {
  const name = document.getElementById('appName').value.trim();
  if (!name) { showToast('请输入应用名称'); return; }
  const type = document.getElementById('appType').value;
  if (!type) { showToast('请选择应用类型'); return; }
  const link = document.getElementById('appLink').value.trim();
  if (!link && !tempAppFileData && !editTargetId) { showToast('请输入应用链接或上传HTML文件'); return; }

  const data = {
    name,
    type,
    link,
    htmlFile: tempAppFileData,
    createdAt: new Date().toISOString(),
  };

  if (editTargetId) {
    const idx = Store.aiApps.findIndex(a => a.id === editTargetId);
    if (idx >= 0) {
      data.id = editTargetId;
      data.createdAt = Store.aiApps[idx].createdAt;
      if (!tempAppFileData) data.htmlFile = Store.aiApps[idx].htmlFile;
      Store.aiApps[idx] = data;
    }
  } else {
    data.id = generateId();
    Store.aiApps.unshift(data);
  }

  const isEdit = !!editTargetId;
  tempAppFileData = null; editTargetId = null;
  saveData();
  closeModal();
  renderCurrentPage();
  showToast(isEdit ? '应用已更新' : '应用添加成功！');
}

// ── Detail Views ──
function openWorkDetail(id) {
  const work = Store.works.find(w => w.id === id);
  if (!work) return;
  const allImages = work.cover ? [work.cover, ...(work.images||[])] : (work.images||[]);
  const container = document.getElementById('modalsContainer');
  container.innerHTML = `
    <div class="detail-overlay" onclick="if(event.target===this)closeModal()">
      <div class="detail-card">
        <div class="detail-cover">
          ${work.cover ? `<img src="${work.cover}" alt="${work.name}"/>` : svgCover({gradient:['#1A1A2E','#16213E'],shapes:[{cx:100,cy:80,r:40,fill:'#334155'},{cx:160,cy:120,r:35,fill:'#475569'}],text:work.name.slice(0,4)})}
          <button class="detail-close" onclick="closeModal()">✕</button>
          <div class="detail-actions">
            <button class="detail-act-btn" onclick="editItem('works','${work.id}')" title="编辑">✎</button>
            <button class="detail-act-btn" onclick="confirmDelete('works','${work.id}')" title="删除" style="color:#FF3B5C">🗑</button>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-title">${work.name}</div>
          ${work.description ? `<div class="detail-desc">${work.description}</div>` : ''}
          <div class="detail-meta">
            ${work.category ? `<span class="tag">${work.category}</span>` : ''}
            <span class="detail-time">${formatTime(work.createdAt)}</span>
          </div>
          ${allImages.length > 1 ? `
            <div class="detail-field">
              <div class="detail-field-label">作品图集 (${allImages.length}张)</div>
              <div class="detail-gallery">
                ${allImages.map((img,i) => `<div class="detail-gallery-item" onclick="viewImage(event,'${img.replace(/'/g,"\\'")}')"><img src="${img}" alt="图片${i+1}" loading="lazy"/></div>`).join('')}
              </div>
            </div>
          ` : ''}
          ${work.link ? `<a class="detail-link" href="${work.link}" target="_blank" onclick="event.stopPropagation()">查看项目 →</a>` : ''}
        </div>
      </div>
    </div>
  `;
}

function openAIImageDetail(id) {
  const work = Store.aiImages.find(w => w.id === id);
  if (!work) return;
  const allImages = work.cover ? [work.cover, ...(work.images||[])] : (work.images||[]);
  const container = document.getElementById('modalsContainer');
  container.innerHTML = `
    <div class="detail-overlay" onclick="if(event.target===this)closeModal()">
      <div class="detail-card">
        <div class="detail-cover">
          ${work.cover ? `<img src="${work.cover}" alt="${work.name}"/>` : svgCover({gradient:['#1A1A2E','#16213E'],shapes:[{cx:100,cy:80,r:40,fill:'#334155'},{cx:160,cy:120,r:35,fill:'#475569'}],text:work.name.slice(0,4)})}
          <button class="detail-close" onclick="closeModal()">✕</button>
          <div class="detail-actions">
            <button class="detail-act-btn" onclick="editItem('aiImages','${work.id}')" title="编辑">✎</button>
            <button class="detail-act-btn" onclick="confirmDelete('aiImages','${work.id}')" title="删除" style="color:#FF3B5C">🗑</button>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-title">${work.name}</div>
          ${work.description ? `<div class="detail-desc">${work.description}</div>` : ''}
          <div class="detail-meta">
            ${work.aiTool ? `<span class="tag">${work.aiTool}</span>` : ''}
            ${work.category ? `<span class="tag tag-outline">${work.category}</span>` : ''}
            <span class="detail-time">${formatTime(work.createdAt)}</span>
          </div>
          ${work.prompt ? `
            <div class="detail-field">
              <div class="detail-field-label">提示词</div>
              <div class="detail-field-value">${work.prompt}</div>
            </div>
          ` : ''}
          ${allImages.length > 1 ? `
            <div class="detail-field">
              <div class="detail-field-label">作品图集 (${allImages.length}张)</div>
              <div class="detail-gallery">
                ${allImages.map((img,i) => `<div class="detail-gallery-item" onclick="viewImage(event,'${img.replace(/'/g,"\\'")}')"><img src="${img}" alt="图片${i+1}" loading="lazy"/></div>`).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function openApp(id) {
  const app = Store.aiApps.find(a => a.id === id);
  if (!app) return;
  if (app.htmlFile) {
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(atob(app.htmlFile.content.split(',')[1]));
      win.document.close();
    }
  } else if (app.link) {
    window.open(app.link, '_blank');
  }
  showToast('正在打开应用...');
}

// ── Image Viewer ──
function viewImage(e, src) {
  e.stopPropagation();
  const container = document.getElementById('modalsContainer');
  container.innerHTML = `
    <div class="image-viewer" onclick="closeModal()">
      <img src="${src}" alt="预览"/>
      <button class="image-viewer-close" onclick="closeModal()">✕</button>
    </div>
  `;
}

// ── Toast ──
function showToast(message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ── Init ──
(function init() {
  loadData();
  updateBadges();
  renderWorks();
})();
</script>
